# The Android build of nikque GUI: the APK for devices (arm64-v8a, Android 10 or later; the engines of the release
# ZIPs) and the APK of this workflow for the emulator (x86_64; the engines built from the sources of the tags of their
# releases), made by tools/make_dist_android.sh, then a run of the second on an emulator with a script (pictures of
# the screen, the log).
# The APK for devices is signed with the key of the secrets NG_KEYSTORE_B64 (a keystore in base64),
# NG_KEYSTORE_PASSWORD, NG_KEY_ALIAS and NG_KEY_PASSWORD. On master (the runs of the releases) the run stops without
# them; on the other branches it signs with a key made for this run alone (an APK signed with another key is not
# installed over this one).
name: Android

on:
  push:
    branches: [port2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: The NDK of the runner
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK}"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          echo "NG_NDK_VERSION=$(basename "$ndk")" >> "$GITHUB_ENV"
          echo "$ndk"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: The source of newedax (the tag of its release)
        uses: actions/checkout@v4
        with:
          repository: Nikque/Heath
          ref: v4.5.5-heath.19
          path: ne

      - name: The source of Edax nikque (the tag of its release)
        uses: actions/checkout@v4
        with:
          repository: Nikque/edax-reversi-AVX
          ref: v4.5.5-nikque.32
          path: nk

      - name: Boost 1.92 (headers, for newedax)
        id: boost
        uses: actions/cache@v4
        with:
          path: boost/boost_1_92_0/boost
          key: boost-1.92.0-linux-c46baee75ed4b558cf6553630d0615a147ed582812917b57e6f0839d1954549f

      - name: Boost 1.92 from boost.org (the same ZIP as the Windows releases of newedax)
        if: steps.boost.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o boost_1_92_0.zip https://archives.boost.io/release/1.92.0/source/boost_1_92_0.zip
          echo "c46baee75ed4b558cf6553630d0615a147ed582812917b57e6f0839d1954549f  boost_1_92_0.zip" | sha256sum -c
          mkdir -p boost
          unzip -q boost_1_92_0.zip 'boost_1_92_0/boost/*' -d boost
          rm boost_1_92_0.zip

      - name: The release ZIPs of the engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.5.5-nikque.32 -R Nikque/edax-reversi-AVX -p 'edax-4.5.5-nikque.32.zip' -D dl
          gh release download v4.5.5-heath.19 -R Nikque/Heath -p 'edax-4.5.5-heath.19-64.zip' -D dl

      - name: The key of the APK
        env:
          KEYSTORE_B64: ${{ secrets.NG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NG_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/ng.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "the key of the secrets"
          elif [ "$GITHUB_REF" = refs/heads/master ]; then
            echo "::error::no key in the secrets NG_KEYSTORE_B64, NG_KEYSTORE_PASSWORD, NG_KEY_ALIAS, NG_KEY_PASSWORD; the APK of a release must be signed with the key of the secrets"
            exit 1
          else
            KEYSTORE_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            KEY_ALIAS=trial
            keytool -genkeypair -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=nikque GUI trial" > /dev/null 2>&1
            echo "a key made for this run alone"
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "NG_KEYSTORE=$ks"
            echo "NG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NG_KEY_ALIAS=$KEY_ALIAS"
            echo "NG_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: The APKs
        run: BOOST_DIR="$PWD/boost/boost_1_92_0" bash tools/make_dist_android.sh dl/edax-4.5.5-nikque.32.zip dl/edax-4.5.5-heath.19-64.zip ne nk .github/ci/smoke-android.txt

      - name: Keep the APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: |
            dist/*.apk
            dist/*-files.txt
          compression-level: 0

      - name: The emulator may use the virtualization of the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK of the CI on an emulator with a script
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/ci/android_run.sh

      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-run
          path: run/
          if-no-files-found: warn
