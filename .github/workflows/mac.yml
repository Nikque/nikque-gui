# Build and verify both native PGO engines before packaging the universal GUI.
name: macOS

on:
  push:
    branches: [mac1]
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner for the universal build and native smoke test
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cpu: arm64
          - runner: macos-15-intel
            cpu: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: The source of Edax nikque
        uses: actions/checkout@v4
        with:
          repository: Nikque/edax-reversi-AVX
          ref: v4.5.5-nikque.34
          path: nk

      - name: The source of newedax (the tag of its release)
        uses: actions/checkout@v4
        with:
          repository: Nikque/Heath
          ref: v4.5.5-heath.21
          path: ne

      - name: Boost 1.92 (headers, for newedax)
        id: boost
        uses: actions/cache@v4
        with:
          path: boost/boost_1_92_0/boost
          key: boost-1.92.0-c46baee75ed4b558cf6553630d0615a147ed582812917b57e6f0839d1954549f

      - name: Boost 1.92 from boost.org (the same ZIP as the Windows releases of newedax)
        if: steps.boost.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o boost_1_92_0.zip https://archives.boost.io/release/1.92.0/source/boost_1_92_0.zip
          echo "c46baee75ed4b558cf6553630d0615a147ed582812917b57e6f0839d1954549f  boost_1_92_0.zip" | shasum -a 256 -c
          mkdir -p boost
          unzip -q boost_1_92_0.zip 'boost_1_92_0/boost/*' -d boost
          rm boost_1_92_0.zip

      - name: The release ZIPs of the engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.5.5-nikque.34 -R Nikque/edax-reversi-AVX -p 'edax-4.5.5-nikque.34.zip' -D dl
          gh release download v4.5.5-heath.21 -R Nikque/Heath -p 'edax-4.5.5-heath.21-64.zip' -D dl

      - name: Train and verify native PGO engines
        run: |
          test "$(uname -m)" = "${{ matrix.cpu }}"
          BOOST_DIR="$PWD/boost/boost_1_92_0" bash tools/make_dist_mac.sh --train dl/edax-4.5.5-nikque.34.zip dl/edax-4.5.5-heath.21-64.zip ne nk pgo

      - name: Keep native PGO engines and evidence
        uses: actions/upload-artifact@v4
        with:
          name: mac-pgo-${{ matrix.cpu }}
          path: pgo/
          if-no-files-found: error

  build:
    needs: train
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build -j 4 -- -k || { cmake --build build -j 1 -- -k 2>&1 | grep -E "error:|warning:" | sort -u | head -150; exit 1; }
          lipo -info "build/nikque GUI.app/Contents/MacOS/nikque GUI"

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: The release ZIPs of the engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.5.5-nikque.34 -R Nikque/edax-reversi-AVX -p 'edax-4.5.5-nikque.34.zip' -D dl
          gh release download v4.5.5-heath.21 -R Nikque/Heath -p 'edax-4.5.5-heath.21-64.zip' -D dl

      - name: Get both native PGO builds
        uses: actions/download-artifact@v4
        with:
          pattern: mac-pgo-*
          merge-multiple: true
          path: pgo

      - name: The distribution
        run: PGO_MAC_DIR="$PWD/pgo" bash tools/make_dist_mac.sh "build/nikque GUI.app" dl/edax-4.5.5-nikque.34.zip dl/edax-4.5.5-heath.21-64.zip

      - name: Run the distribution with a script
        run: |
          d=$(ls -d dist/nikque-gui-*-mac | head -1)
          cp -R "$d" run
          cp .github/ci/smoke.txt run/
          sed -i '' -e 's/^startup=.*/startup=smoke.txt/' -e 's/^level=21/level=10/' run/config.ini
          grep -n "startup\|^level\|^kind" run/config.ini
          cd run
          # (failed: an exit code other than 0, the end by the time limit, or a file of the script missing)
          ( sleep 900; touch timed-out; pkill -f "nikque GUI.app" ) &
          watch=$!
          rc=0
          "./nikque GUI.app/Contents/MacOS/nikque GUI" || rc=$?
          kill $watch 2>/dev/null || true
          ls -la
          if [ -e timed-out ]; then echo "timeout: the script did not end"; exit 1; fi
          if [ "$rc" != 0 ]; then echo "exit $rc"; exit 1; fi
          bash ../.github/ci/check_smoke.sh smoke.txt .

      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-run
          path: |
            run/*.png
            run/*.txt
            run/config.ini
          if-no-files-found: warn

      - name: Keep the distribution
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.zip
            dist/*-files.txt
          if-no-files-found: error
          compression-level: 0
